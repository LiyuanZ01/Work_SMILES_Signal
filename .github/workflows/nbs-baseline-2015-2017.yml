name: Archive official NBS 2015-2017 provincial baseline

on:
  push:
    branches:
      - agent/wto-v15-native-data-run
    paths:
      - ".github/workflows/nbs-baseline-2015-2017.yml"
      - "customs_v19/archive_baseline_2015_2017.py"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/nbs-baseline-2015-2017.yml"
      - "customs_v19/archive_baseline_2015_2017.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests
      - name: Archive official baseline tables
        env:
          PYTHONUNBUFFERED: "1"
        run: python customs_v19/archive_baseline_2015_2017.py
      - name: Record checksums
        if: always()
        run: |
          mkdir -p customs_v19/baseline_2015_2017_assets
          cd customs_v19/baseline_2015_2017_assets
          sha256sum * > SHA256SUMS.txt || true
          ls -lah
      - name: Upload baseline source archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nbs-provincial-baseline-2015-2017-assets
          path: customs_v19/baseline_2015_2017_assets/
          if-no-files-found: warn
          retention-days: 14
