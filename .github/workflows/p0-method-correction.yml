name: P0 method correction audit

on:
  push:
    branches:
      - agent/wto-v15-native-data-run
    paths:
      - ".github/workflows/p0-method-correction.yml"
      - "external_demand_wto/run_p0_method_correction.py"
      - "external_demand_wto/run_p0_method_correction_v2.py"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/p0-method-correction.yml"
      - "external_demand_wto/run_p0_method_correction.py"
      - "external_demand_wto/run_p0_method_correction_v2.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p0-correction:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: external_demand_wto/requirements.txt
      - name: Install frozen environment and Chromium
        run: |
          python -m pip install --requirement external_demand_wto/requirements.txt
          python -m pip install playwright openpyxl xlrd
          python -m playwright install --with-deps chromium
      - name: Reconstruct frozen weights and REER inputs
        env:
          PYTHONUNBUFFERED: "1"
          V15_OUTPUT_DIR: external_demand_wto/results
        run: python external_demand_wto/run_native_wto_v15_wrapper.py
      - name: Export exact WTO portal selections
        env:
          PYTHONUNBUFFERED: "1"
        run: python external_demand_wto/export_wto_stats_selected_series.py
      - name: Rebuild direct-WTO official model inputs
        env:
          PYTHONUNBUFFERED: "1"
          BASE_RESULTS_DIR: external_demand_wto/results
          OFFICIAL_EXPORT_DIR: external_demand_wto/wto_exact_export
          OFFICIAL_OUTPUT_DIR: external_demand_wto/official_results
        run: python external_demand_wto/build_official_wto_results.py
      - name: Run P0 method correction audit
        env:
          PYTHONUNBUFFERED: "1"
          P0_INPUT_DIR: external_demand_wto/official_results
          P0_OUTPUT_DIR: external_demand_wto/p0_corrected_results
        run: python external_demand_wto/run_p0_method_correction_v2.py
      - name: Record checksums
        if: always()
        shell: bash
        run: |
          for dir in official_results p0_corrected_results wto_exact_export; do
            mkdir -p "$GITHUB_WORKSPACE/external_demand_wto/$dir"
            cd "$GITHUB_WORKSPACE/external_demand_wto/$dir"
            sha256sum * > SHA256SUMS.txt || true
            find . -maxdepth 1 -type f -printf '%f\t%s bytes\n' | sort > FILE_INVENTORY.txt
          done
      - name: Upload P0 correction artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-wto-p0-method-correction
          path: |
            external_demand_wto/official_results/
            external_demand_wto/p0_corrected_results/
            external_demand_wto/wto_exact_export/
          if-no-files-found: error
          retention-days: 30
