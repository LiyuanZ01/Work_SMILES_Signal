name: Archive official WTO portal exports

on:
  push:
    branches:
      - agent/wto-v15-native-data-run
    paths:
      - ".github/workflows/wto-official-portal-archive.yml"
      - "external_demand_wto/archive_official_wto_portal.py"
      - "external_demand_wto/convert_and_audit_official_wto_xls.py"
      - "external_demand_wto/discover_wto_stats_public_api.py"
      - "external_demand_wto/export_wto_stats_selected_series.py"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/wto-official-portal-archive.yml"
      - "external_demand_wto/archive_official_wto_portal.py"
      - "external_demand_wto/convert_and_audit_official_wto_xls.py"
      - "external_demand_wto/discover_wto_stats_public_api.py"
      - "external_demand_wto/export_wto_stats_selected_series.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-wto:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install archive and workbook environment
        run: |
          python -m pip install requests playwright pandas openpyxl xlrd
          python -m playwright install --with-deps chromium
      - name: Archive direct WTO-origin data and metadata
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
        run: python external_demand_wto/archive_official_wto_portal.py
      - name: Convert and audit official WTO workbook
        if: always()
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          if [ -s external_demand_wto/wto_official_archive/wto_legacy_quarterly_volume.xls ]; then
            python external_demand_wto/convert_and_audit_official_wto_xls.py
          else
            echo "Official workbook was not downloaded; conversion skipped." | tee external_demand_wto/wto_official_archive/conversion_skipped.txt
          fi
      - name: Discover current WTO Stats public data API
        if: always()
        env:
          PYTHONUNBUFFERED: "1"
        run: python external_demand_wto/discover_wto_stats_public_api.py
      - name: Export exact China and partner volume selections
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
        run: python external_demand_wto/export_wto_stats_selected_series.py
      - name: Record checksums and inventory
        if: always()
        run: |
          mkdir -p external_demand_wto/wto_official_archive external_demand_wto/wto_exact_export
          for dir in wto_official_archive wto_exact_export; do
            cd "$GITHUB_WORKSPACE/external_demand_wto/$dir"
            sha256sum * > SHA256SUMS.txt || true
            find . -maxdepth 1 -type f -printf '%f\t%s bytes\n' | sort > FILE_INVENTORY.txt
            cat FILE_INVENTORY.txt
          done
      - name: Upload official WTO archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wto-official-portal-archive
          path: |
            external_demand_wto/wto_official_archive/
            external_demand_wto/wto_exact_export/
          if-no-files-found: error
          retention-days: 30

# Direct WTO-origin archival only; mirror observations are not substituted.
