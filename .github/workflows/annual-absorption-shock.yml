name: Annual partner domestic-absorption shock

on:
  push:
    branches:
      - agent/wto-v15-native-data-run
    paths:
      - ".github/workflows/annual-absorption-shock.yml"
      - "external_demand_wto/build_annual_absorption_shock.py"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/annual-absorption-shock.yml"
      - "external_demand_wto/build_annual_absorption_shock.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-shock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas requests
      - name: Rebuild annual partner demand measures
        env:
          PYTHONUNBUFFERED: "1"
        run: python external_demand_wto/build_annual_absorption_shock.py
      - name: Record checksums
        run: |
          cd external_demand_wto/annual_absorption_shock
          sha256sum * > SHA256SUMS.txt
          ls -lah
      - name: Upload annual demand archive
        uses: actions/upload-artifact@v4
        with:
          name: annual-partner-domestic-absorption-shock
          path: external_demand_wto/annual_absorption_shock/
          if-no-files-found: error
          retention-days: 14
