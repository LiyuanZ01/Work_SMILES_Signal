name: P1 UN Comtrade direct-weight audit

on:
  push:
    branches:
      - agent/wto-v15-native-data-run
    paths:
      - ".github/workflows/p1-uncomtrade-direct-weights.yml"
      - "external_demand_wto/run_p1_uncomtrade_direct_weights.py"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/p1-uncomtrade-direct-weights.yml"
      - "external_demand_wto/run_p1_uncomtrade_direct_weights.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uncomtrade-direct-weights:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: external_demand_wto/requirements.txt
      - name: Install environment and Chromium
        run: |
          python -m pip install --requirement external_demand_wto/requirements.txt
          python -m pip install playwright openpyxl xlrd
          python -m playwright install --with-deps chromium
      - name: Reconstruct frozen inputs
        env:
          V15_OUTPUT_DIR: external_demand_wto/results
        run: python external_demand_wto/run_native_wto_v15_wrapper.py
      - name: Export official WTO quarterly series
        run: python external_demand_wto/export_wto_stats_selected_series.py
      - name: Rebuild official quarterly model data
        env:
          BASE_RESULTS_DIR: external_demand_wto/results
          OFFICIAL_EXPORT_DIR: external_demand_wto/wto_exact_export
          OFFICIAL_OUTPUT_DIR: external_demand_wto/official_results
        run: python external_demand_wto/build_official_wto_results.py
      - name: Run UN Comtrade direct bilateral weight audit
        run: |
          python external_demand_wto/run_p1_uncomtrade_direct_weights.py \
            --partner-imports external_demand_wto/official_results/wto_partner_import_volume.csv \
            --model-data external_demand_wto/official_results/v15_model_data.csv \
            --old-weights external_demand_wto/official_results/reconstructed_fixed_weights_all_markets.csv \
            --output-dir external_demand_wto/p1_uncomtrade_results
      - name: Checksums
        if: always()
        run: |
          mkdir -p external_demand_wto/p1_uncomtrade_results
          cd external_demand_wto/p1_uncomtrade_results
          sha256sum * > SHA256SUMS.txt || true
          find . -maxdepth 1 -type f -printf '%f\t%s bytes\n' | sort > FILE_INVENTORY.txt
      - name: Upload UN Comtrade P1 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-p1-uncomtrade-direct-weights
          path: external_demand_wto/p1_uncomtrade_results/
          if-no-files-found: error
          retention-days: 30
