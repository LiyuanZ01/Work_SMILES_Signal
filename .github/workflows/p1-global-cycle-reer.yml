name: P1 global-cycle and REER audit

on:
  push:
    branches:
      - agent/wto-v15-native-data-run
    paths:
      - ".github/workflows/p1-global-cycle-reer.yml"
      - "external_demand_wto/export_wto_world_import_volume.py"
      - "external_demand_wto/run_p1_global_cycle_reer_audit.py"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/p1-global-cycle-reer.yml"
      - "external_demand_wto/export_wto_world_import_volume.py"
      - "external_demand_wto/run_p1_global_cycle_reer_audit.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p1-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: external_demand_wto/requirements.txt
      - name: Install environment and Chromium
        run: |
          python -m pip install --requirement external_demand_wto/requirements.txt
          python -m pip install playwright openpyxl xlrd
          python -m playwright install --with-deps chromium
      - name: Reconstruct frozen weights and REER
        env:
          PYTHONUNBUFFERED: "1"
          V15_OUTPUT_DIR: external_demand_wto/results
        run: python external_demand_wto/run_native_wto_v15_wrapper.py
      - name: Export China and partner official WTO series
        run: python external_demand_wto/export_wto_stats_selected_series.py
      - name: Rebuild official baseline model data
        env:
          BASE_RESULTS_DIR: external_demand_wto/results
          OFFICIAL_EXPORT_DIR: external_demand_wto/wto_exact_export
          OFFICIAL_OUTPUT_DIR: external_demand_wto/official_results
        run: python external_demand_wto/build_official_wto_results.py
      - name: Export world import-volume series
        run: python external_demand_wto/export_wto_world_import_volume.py
      - name: Run P1 robustness audit
        run: |
          python external_demand_wto/run_p1_global_cycle_reer_audit.py \
            --model-data external_demand_wto/official_results/v15_model_data.csv \
            --world-import-zip external_demand_wto/wto_exact_export/world_import_official_portal_csv.zip \
            --output-dir external_demand_wto/p1_global_cycle_results
      - name: Checksums
        if: always()
        run: |
          for dir in official_results wto_exact_export p1_global_cycle_results; do
            mkdir -p external_demand_wto/$dir
            cd $GITHUB_WORKSPACE/external_demand_wto/$dir
            sha256sum * > SHA256SUMS.txt || true
            find . -maxdepth 1 -type f -printf '%f\t%s bytes\n' | sort > FILE_INVENTORY.txt
          done
      - name: Upload P1 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-wto-p1-global-cycle-reer
          path: |
            external_demand_wto/p1_global_cycle_results/
            external_demand_wto/wto_exact_export/world_import_*
          if-no-files-found: error
          retention-days: 30
