name: WTO v15 native-data run

on:
  push:
    branches:
      - agent/wto-v15-native-data-run
    paths:
      - ".github/workflows/wto-v15-native-data.yml"
      - "external_demand_wto/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/wto-v15-native-data.yml"
      - "external_demand_wto/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce-v15:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: external_demand_wto/requirements.txt

      - name: Install frozen environment
        run: python -m pip install --requirement external_demand_wto/requirements.txt

      - name: Download, audit, and estimate with BIS REER
        env:
          PYTHONUNBUFFERED: "1"
          V15_OUTPUT_DIR: external_demand_wto/results
        run: python external_demand_wto/run_native_wto_v15_wrapper.py

      - name: Record output checksums
        shell: bash
        run: |
          cd external_demand_wto/results
          sha256sum * > SHA256SUMS.txt
          ls -lah

      - name: Upload reproducibility artifact
        uses: actions/upload-artifact@v4
        with:
          name: wto-v15-native-results
          path: external_demand_wto/results/
          if-no-files-found: error
          retention-days: 14
