name: WTO v15 native-data, P1 and current-GDP P2 audits

on:
  push:
    branches:
      - agent/wto-v15-native-data-run
    paths:
      - ".github/workflows/wto-v15-native-data.yml"
      - "external_demand_wto/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/wto-v15-native-data.yml"
      - "external_demand_wto/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce-v15-p1-p2:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: external_demand_wto/requirements.txt

      - name: Install frozen environment
        run: python -m pip install --requirement external_demand_wto/requirements.txt

      - name: Run final native-data audit and models
        env:
          PYTHONUNBUFFERED: "1"
          V15_OUTPUT_DIR: external_demand_wto/results
        run: python external_demand_wto/run_native_wto_v15_wrapper.py

      - name: Run P1 submission robustness audit
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python external_demand_wto/run_v15_p1_submission_audit.py \
            --input-dir external_demand_wto/results \
            --output-dir external_demand_wto/p1_results \
            --bootstrap-reps 3000 \
            --break-reps 1000

      - name: Run current-OECD GDP P2 audit
        env:
          PYTHONUNBUFFERED: "1"
          V15_OUTPUT_DIR: external_demand_wto/results
          P2_CURRENT_OUTPUT_DIR: external_demand_wto/p2_current_results
          P2_CURRENT_BOOT_REPS: "2500"
        run: python external_demand_wto/run_p2_gdp_current.py

      - name: Record output checksums
        shell: bash
        run: |
          for dir in results p1_results p2_current_results; do
            cd "$GITHUB_WORKSPACE/external_demand_wto/$dir"
            sha256sum * > SHA256SUMS.txt
            ls -lah
          done

      - name: Upload reproducibility artifact
        uses: actions/upload-artifact@v4
        with:
          name: wto-v15-p1-current-gdp-p2-results
          path: |
            external_demand_wto/results/
            external_demand_wto/p1_results/
            external_demand_wto/p2_current_results/
          if-no-files-found: error
          retention-days: 14
