name: NBS v18 provincial indicator discovery

on:
  push:
    branches:
      - agent/wto-v15-native-data-run
    paths:
      - ".github/workflows/nbs-v18-discovery.yml"
      - "customs_v19/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/nbs-v18-discovery.yml"
      - "customs_v19/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-nbs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal environment
        run: python -m pip install pandas requests
      - name: Discover current official NBS indicators
        env:
          PYTHONUNBUFFERED: "1"
        run: python customs_v19/discover_nbs_province_indicators.py
      - name: Record checksums
        run: |
          cd customs_v19/nbs_discovery
          sha256sum * > SHA256SUMS.txt
          ls -lah
      - name: Upload NBS discovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: nbs-v18-provincial-indicator-discovery
          path: customs_v19/nbs_discovery/
          if-no-files-found: error
          retention-days: 14
