name: Reference metadata audit
on:
  push:
    branches:
      - agent/wto-v15-native-data-run
    paths:
      - ".github/workflows/reference-metadata-audit.yml"
      - "reference_audit/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/reference-metadata-audit.yml"
      - "reference_audit/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests
      - name: Verify Crossref and source metadata
        run: python reference_audit/audit_references_crossref.py
      - name: Checksums
        if: always()
        run: |
          mkdir -p reference_audit/results
          cd reference_audit/results
          sha256sum * > SHA256SUMS.txt || true
          ls -lah
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-metadata-audit
          path: reference_audit/results/
          if-no-files-found: error
          retention-days: 30
